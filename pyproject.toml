[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agenthandoff"
version = "0.1.0"
description = "Hand off any AI coding CLI session to the next one — deterministic, fully local, zero dependencies, no API keys."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "agenthandoff contributors" }]
keywords = [
  "ai",
  "agents",
  "claude-code",
  "codex",
  "zcode",
  "codebuddy",
  "opencode",
  "handoff",
  "context-window",
  "developer-tools",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
zstd = ["zstandard>=0.22"]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
handoff = "agent_handoff.cli:main"

[project.urls]
Homepage = "https://github.com/czri23333/agenthandoff"
Repository = "https://github.com/czri23333/agenthandoff"
Issues = "https://github.com/czri23333/agenthandoff/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_handoff"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "agent_handoff/server/static"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
