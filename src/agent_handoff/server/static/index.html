    <script>
      // Resolve the palette before first paint: the alternative is a white (or
      // black) flash on every load. Same rule as theme.ts, kept tiny.
      try {
        var mode = localStorage.getItem("ah-theme") || "auto";
        var dark =
          mode === "auto"
            ? matchMedia("(prefers-color-scheme: dark)").matches
            : mode === "dark";
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.themeMode = mode;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
