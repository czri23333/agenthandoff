name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev,zstd,server]"
      - name: Test
        run: pytest --junitxml=junit.xml
      - name: Name the failing tests in the Checks tab
        if: failure()
        run: python scripts/ci_annotate_failures.py junit.xml
      - name: Lint
        run: ruff check .
      - name: Support matrix matches the fixtures
        run: python -m agent_handoff.evidence --check
      - name: Format fingerprints have not drifted
        run: python -m agent_handoff.conformance --check
      - name: CLI smoke
        run: |
          handoff --version
          handoff doctor
          handoff matrix

  frontend:
    # The cockpit's built assets are committed (src/agent_handoff/server/static)
    # and shipped inside the wheel, so a TypeScript error, a broken Vite build,
    # or a forgotten rebuild all reach users while every Python gate stays
    # green. This job typechecks, builds, and proves the committed dist is what
    # the source produces.
    #
    # It runs on Windows because that is where the committed artifacts are
    # authored: comparing a Linux-built tree against a Windows-built one would
    # report formatting differences as failures, and a gate that cries wolf is
    # ignored. A Linux-based contributor would see this flag their rebuild;
    # CONTRIBUTING records the trade.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend deps
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Typecheck the cockpit
        working-directory: web
        run: npx tsc -b
      - name: Mark the dist before building
        shell: bash
        run: touch .dist-build-marker
      - name: Build the cockpit
        working-directory: web
        run: npm run build
      - name: The build actually wrote the dist
        shell: bash
        run: |
          # "No differences" is not the same claim as "the build wrote here": if
          # vite's outDir ever moves, the comparison below passes while the
          # shipped cockpit stays stale. Vite rewrites every asset, so at least
          # one file must be newer than the marker.
          if [ -z "$(find src/agent_handoff/server/static/assets -type f -newer .dist-build-marker -print -quit)" ]; then
            echo "::error title=cockpit build wrote nothing::no asset is newer than the build start — check web/vite.config.ts build.outDir still points at src/agent_handoff/server/static."
            exit 1
          fi
          echo "the build rewrote the dist"
      - name: Committed dist matches the source
        shell: bash
        run: |
          # --porcelain (not just diff) so an asset the build no longer emits,
          # or a new one it started emitting, is caught too.
          if [ -n "$(git status --porcelain -- src/agent_handoff/server/static)" ]; then
            git --no-pager diff --stat -- src/agent_handoff/server/static
            git status --porcelain -- src/agent_handoff/server/static
            echo "::error title=stale cockpit dist::the committed dist is not what web/ builds. Run 'npm ci && npm run build' in web/ and commit src/agent_handoff/server/static."
            exit 1
          fi
          rm -f .dist-build-marker
          echo "committed dist matches a fresh build"


